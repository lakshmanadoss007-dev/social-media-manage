<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-6">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold border border-blue-500/30">
            ⚡
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">Social Media Manager</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Deployment status on <span class="text-blue-400 font-mono font-semibold">Vercel</span>.
        </p>
        <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-700/60 text-left text-xs font-mono space-y-3">
            <div class="flex items-center gap-2 text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Vercel Edge Deployment: LIVE & ACTIVE</span>
            </div>
            <div class="flex items-center gap-2 text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>Frontend Gateway: Responding (200 OK)</span>
            </div>
            <div class="flex items-center gap-2 text-sky-400">
                <span class="w-2 h-2 rounded-full bg-sky-400"></span>
                <span>GitHub Repository: Synced</span>
            </div>
        </div>
        <div class="pt-4 border-t border-slate-700/60 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="https://github.com/lakshmanadoss007-dev/social-media-manager" target="_blank" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition">
                View GitHub Repository
            </a>
        </div>
    </div>
</body>
</html>
